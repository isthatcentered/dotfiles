.reviewer-attribution{display:inline-flex;align-items:center;gap:8px;font-size:10px;color:#637087;padding:0 2px}
.reviewer-avatars{display:inline-flex;align-items:center;padding-left:3px}
.reviewer-avatar{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin-left:-3px;border:2px solid #fff;border-radius:50%;background:#f0f2f6;box-shadow:0 0 0 1px #e1e5ed}
.agent-logo{display:block;width:16px;height:16px;object-fit:contain}
.reviewer-name{display:inline-flex;align-items:center;gap:8px}
.agent-logo.claude{filter:invert(53%) sepia(27%) saturate(789%) hue-rotate(329deg) brightness(91%) contrast(89%)}

/* Light syntax palette on all source panels; range highlights remain visible. */
.code-body .hljs-keyword,.code-body .hljs-selector-tag,.code-body .hljs-doctag{color:#a02d83}
.code-body .hljs-title,.code-body .hljs-title.function_,.code-body .hljs-function .hljs-title{color:#215fc0}
.code-body .hljs-string,.code-body .hljs-regexp,.code-body .hljs-template-tag{color:#26724b}
.code-body .hljs-number,.code-body .hljs-literal{color:#b05b12}
.code-body .hljs-built_in,.code-body .hljs-type,.code-body .hljs-title.class_{color:#7852a6}
.code-body .hljs-attr,.code-body .hljs-property,.code-body .hljs-attribute{color:#955c22}
.code-body .hljs-comment,.code-body .hljs-quote{color:#89939c;font-style:italic}
.code-body .hljs-params,.code-body .hljs-subst{color:#37465d}
.code-body .hljs-meta{color:#617697}



/* Shared editor: file tabs and controls in one quiet toolbar. */
.editor-panel{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.editor-toolbar{display:flex;align-items:center;min-height:42px;flex-shrink:0;border-bottom:1px solid #e2e5eb;background:#fff}
.editor-panel .file-tabs{flex:1 1 auto;min-width:0;padding:0 12px;gap:14px;background:#fff;border:0;flex-wrap:nowrap;overflow-x:auto}
.editor-panel .file-tabs button{height:41px;padding:9px 3px;font-size:11px;font-weight:400;white-space:nowrap;flex-shrink:0;border:0;border-bottom:2px solid transparent;border-radius:0;color:#7b8494}
.editor-panel .file-tabs button:hover{color:#344159;background:#f8f9fc}
.editor-panel .file-tabs button span{opacity:.55;font-size:10px}
.editor-panel .file-tabs button.active{background:transparent;border-bottom-color:#153ccc;color:#344159;font-weight:500;box-shadow:none}
.editor-panel .source-controls{flex:0 0 auto;gap:8px;padding:5px 10px 5px 2px;border:0;justify-content:flex-end}
.editor-panel .segmented{background:#eceff3;border:0;border-radius:6px;padding:3px}
.editor-panel .segmented button{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:10px;padding:4px 9px;border-radius:4px;color:#7b8493}
.editor-panel .segmented button.active{background:#153ccc;color:#fff;box-shadow:none;border-radius:4px}
.editor-panel .comment-icon{width:27px;height:27px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:4px;color:#98a3b4;padding:0}
.editor-panel .comment-icon.active{color:#5f7193;background:#eef2f8}
.editor-panel .comment-icon:hover{border-color:#d6dfed;color:#344e7d;background:#f4f6fb}
.editor-panel .code-body{flex:1;min-height:0;max-height:none;padding:12px 0 24px;background:#fcfcff}
.editor-panel .code-line{font:11px/1.8 ui-monospace,SFMono-Regular,monospace;padding:2px 18px 2px 0;color:#1e2432}
.editor-panel .code-line.highlight{background:#edf1ff;box-shadow:inset 2px 0 #153ccc}
.editor-panel .line-number{color:#a0a7b5}
.editor-panel .source-path.source-status{padding:6px 18px;background:#edf0f6;border-top:1px solid #dde3ed;border-bottom:0;font:10px/1.6 ui-monospace,monospace;color:#56647c;align-items:center;flex-shrink:0}
.editor-panel .source-status small{font-size:9px;opacity:1;color:#8290a4}
.editor-panel .inline-review-comment{margin:10px 20px 14px 42px;border:1px solid #dae2f2;border-radius:6px;background:#fff;white-space:normal;max-width:calc(100% - 62px);padding:12px 15px;box-shadow:0 2px 5px #24365204}
.editor-panel .inline-comment-heading{display:flex;align-items:center;gap:7px;font:10px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;color:#99a4b6}
.editor-panel .inline-comment-heading strong{font-weight:600;color:#60769d}
.editor-panel .comment-mark{color:#9aaccc}
.editor-panel .inline-review-comment p{font:12px/1.75 -apple-system,BlinkMacSystemFont,sans-serif;color:#5b6c88;margin:7px 0 0}


/* Always-visible confidence and distinct expected/predicted outcomes. */
.confidence-limits{border-top:1px solid #e1e4e9;margin-top:12px;padding:22px 0 8px}
.confidence-limits h3{margin:0 0 14px;font-size:13px}
.confidence-limits p{font-size:12px;line-height:1.8;color:#727d8c}
.repro .expected{border-left:3px solid #71a58a;background:#f1f8f4;color:#365d49;padding:11px 14px;border-radius:0 5px 5px 0}
.repro .actual{border-left:3px solid #d38e80;background:#fff4f0;color:#875044;padding:11px 14px;border-radius:0 5px 5px 0}
.repro .expected span{color:#42805e;opacity:1}
.repro .actual span{color:#b26452;opacity:1}


/* Continuous review experiments. All source and triage controls use the same data. */
.flow{overflow-anchor:none;--rail:0px;--blue:#153ccc;--line:#e0e5ee;--ink:#26334a;--muted:#728097;color:var(--ink);background:#fff;min-height:100vh}
.flow-layout{margin-left:var(--rail);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.flow-reading{min-width:0;padding-bottom:120px;overflow-anchor:none}
.flow-code{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line);background:#fcfcff;overflow:hidden}
.flow-code .editor-panel{flex:1;min-height:0;border:0;border-radius:0}
.flow-code-heading{display:flex;align-items:center;gap:11px;padding:12px 18px;min-height:62px;flex-shrink:0;background:#f7f9fc;border-bottom:1px solid var(--line)}
.flow-code-index{font:11px ui-monospace,monospace;background:#e8eeff;color:#153ccc;display:grid;place-items:center;width:29px;height:29px;border-radius:5px;flex-shrink:0}
.flow-code-heading>div{min-width:0;flex:1}
.flow-code-heading small{font-size:9px;color:#8490a3;display:block;margin-bottom:3px}
.flow-code-heading strong{font-size:12px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow-indicator{font-size:9px;color:#8794a8;white-space:nowrap;display:flex;align-items:center;gap:5px}
.follow-indicator i{display:block;width:5px;height:5px;border-radius:50%;background:#527ae3}
.flow-code .editor-panel .code-line{font-size:12px}
.flow-code-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;padding:50px;color:#7b889d}
.flow-code-empty>span{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#e4eee9;color:#3e7659;font-size:22px;margin-bottom:24px}
.flow-code-empty h2{font-size:21px;color:#3e4f68}
.flow-code-empty p{max-width:280px}
.flow .primary{background:var(--blue);color:#fff}
.flow .brand-symbol{background:var(--blue)}
.flow p{font-size:14px;line-height:1.8;color:#58687e}
.flow .eyebrow{font-size:10px;color:#7b88a0}
.flow .tags{margin:16px 0;align-items:center;gap:7px}
.flow .badge{font-size:10px}
.flow .badge.likelihood{background:#edf1f8;color:#5a6980}
.flow .reviewer-attribution{font-family:system-ui,sans-serif}
.flow .reviewer-avatar{width:22px;height:22px}
.flow h3{font-size:14px;font-weight:650}
.flow .repro{padding:22px 0 12px}
.flow .repro h3{margin:0 0 17px}
.flow .repro ol{font-size:13px;line-height:1.75;padding-left:22px}
.flow .repro li{padding:4px 0 7px}
.flow .expected,.flow .actual{font-size:13px;line-height:1.7;padding:13px 15px}
.flow .repro small{font-size:11px}
.flow .confidence-limits{padding:24px 0 0;margin:15px 0 0}
.flow .confidence-limits p{font-size:12px;line-height:1.85;color:#6a7890}
.flow .note-label{margin-top:0;font-size:11px}
.flow .note-label>span{font-size:10px}
.flow .note-label textarea{min-height:64px;font-size:12px;background:#fff}
.flow-decision{margin-top:26px;border-top:1px solid var(--line);padding-top:23px}
.flow .decision-actions{margin:14px 0 0}
.flow .decision-actions button{padding:9px 16px}
.flow-overview{padding:32px 36px 26px;border-bottom:1px solid var(--line)}
.flow-topline{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}
.flow-topline .brand{font-size:17px}
.flow-overview h1{font-size:34px;line-height:1.14;font-weight:650;letter-spacing:-1.2px}
.overview-deck{margin:13px 0 18px!important;font-size:13px!important;color:#7b889b!important}
.flow-scope{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:10px;color:#8290a4;margin:20px 0 25px}
.flow-scope code{font:10px ui-monospace,monospace;color:#78859b}
.change-list{list-style:none;padding:0;margin:23px 0;display:flex;flex-direction:column;gap:14px}
.change-list li{display:flex;gap:12px;align-items:baseline;font-size:14px;line-height:1.65;color:#3e516d}
.change-number{font:10px ui-monospace,monospace;color:#94a2b8;flex-shrink:0}
.flow-coverage{padding:13px 15px;border:1px solid #e4d9bd;background:#fffbf1;border-radius:5px;margin:24px 0 12px;color:#78643a}
.flow-coverage>span{display:block;font-size:11px;line-height:1.8}
.flow-coverage .agent-logo{display:inline-block;vertical-align:middle;width:14px;height:14px;margin-right:5px}
.flow-coverage small{display:block;font-size:10px;color:#9a8d73;margin-top:5px}
.flow-context{padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.flow-context summary{display:flex;justify-content:space-between;font-size:11px;color:#6c7a91}
.flow-context p{font-size:12px}
.flow-context[open] summary span{transform:rotate(45deg)}
.overview-tail{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 0 2px}
.flow-counts{display:flex;gap:17px;flex-wrap:wrap;font-size:10px;color:#7a889c}
.flow-counts strong{font-size:13px;color:#485d7d;font-weight:650;margin-right:2px}
.findings-start{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:28px 36px 21px}
.findings-start h2{font-size:18px;letter-spacing:-.3px}
.findings-start>span{font-size:10px;color:#8391a6}
.flow-finding{padding:30px 36px 36px;border-top:1px solid var(--line);position:relative;scroll-margin-top:25vh}
.finding-chapter{display:flex;justify-content:space-between;gap:12px;color:#8997ac;font:10px/1.5 ui-monospace,monospace;margin-bottom:14px}
.finding-chapter>span:first-child{color:#153ccc}
.flow-finding h2{font-size:28px;line-height:1.24;font-weight:650;letter-spacing:-.8px}
.flow-finding-header{margin-bottom:27px;position:relative}
.flow-finding.is-current .flow-finding-header:before{content:'';position:absolute;left:-36px;top:0;height:28px;border-left:3px solid #153ccc}
.finding-consequence{background:#f2f5ff;border:1px solid #dce4f8;border-radius:6px;padding:18px 20px;margin-bottom:26px}
.finding-consequence h3{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#5b75ae}
.finding-consequence p{font-size:17px;line-height:1.65;margin:9px 0 0;color:#385580}
.finding-mechanism{margin:25px 0 7px}
.flow .origin{margin-top:14px;font-size:10px}
.flow-archives{padding:35px 36px 20px;border-top:1px solid var(--line);scroll-margin-top:30px}
.flow-archives>.eyebrow{margin-bottom:18px}
.flow-archive{border:1px solid var(--line);border-radius:6px;margin:10px 0;background:#f9fafc}
.flow-archive>summary{display:flex;align-items:center;gap:10px;padding:17px 18px;color:#6f7c90}
.flow-archive>summary strong{font-size:13px;font-weight:550}
.archive-mark{font-size:14px;color:#8e9aad}
.archive-count{font-size:10px;background:#e9edf3;padding:2px 7px;border-radius:4px}
.archive-chevron{margin-left:auto;color:#939fb0;transition:transform .15s}
.flow-archive[open] .archive-chevron{transform:rotate(180deg)}
.flow-archive .flow-finding{background:#fff;padding:26px 23px 30px;border-top:1px solid var(--line)}
.flow-archive .flow-finding h2{font-size:23px}
.flow-archive .flow-finding.is-current .flow-finding-header:before{left:-23px}
.flow-archive .flow-finding .journal-chapter-number,.flow-archive .flow-finding .journey-node{display:none}
.archive-empty{padding:0 18px 15px;font-size:12px!important}
.flow-endnote{font-size:10px!important;color:#9aa5b5!important;margin-top:25px}
.flow-rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail);overflow:auto;display:flex;flex-direction:column;border-right:1px solid var(--line);padding:26px 14px;background:#f8f9fb}
.flow-rail-brand{padding:0 11px 30px}
.flow-rail .brand{font-size:14px}
.overview-link{text-align:left;padding:11px 12px;font-size:12px;color:#63738d}
.flow-rail-label{font-size:9px;letter-spacing:.1em;padding:26px 12px 13px;color:#99a4b6}
.flow-rail-items{display:flex;flex-direction:column;gap:4px}
.flow-rail-items button{display:flex;gap:10px;padding:13px 11px;border-radius:6px;text-align:left;border:1px solid transparent}
.flow-rail-items button.active{background:#edf1ff;border-color:#cbd7f5}
.rail-number{font:10px/1.8 ui-monospace,monospace;color:#8ea0bc}
.rail-title{font-size:12px;font-weight:550;line-height:1.45;flex:1;color:#5d6d84}
.rail-title small{display:block;font-size:9px;font-weight:400;margin-top:6px;color:#97a3b6}
.flow-rail-items button.active .rail-title,.flow-rail-items button.active .rail-number{color:#153ccc}
.rail-check{font-size:10px;color:#8393aa}
.flow-rail-bottom{margin-top:auto;padding:28px 11px 100px}
.flow-rail-bottom .flow-counts{gap:12px;flex-direction:column}
.flow-rail-bottom>small{display:block;font-size:10px;color:#a0abba;line-height:1.8;margin-top:26px}
.flow-toast{position:fixed;bottom:82px;left:calc(var(--rail) + 24px);z-index:80;display:flex;align-items:center;gap:20px;padding:12px 16px;background:#263853;color:#fff;box-shadow:0 5px 20px #0002;border-radius:7px;font-size:12px}
.flow-toast button{font-weight:650;color:#bacbff;text-decoration:underline;font-size:11px}
body:is([data-variant="11"],[data-variant="17"],[data-variant="15"],[data-variant="16"]) .prototype-switcher{left:16px;bottom:16px;transform:none;padding:7px;gap:4px;border-radius:10px}
body:is([data-variant="11"],[data-variant="17"],[data-variant="15"],[data-variant="16"]) .switcher-label,
body:is([data-variant="11"],[data-variant="17"],[data-variant="15"],[data-variant="16"]) .switcher-description{display:none}
body:is([data-variant="11"],[data-variant="17"],[data-variant="15"],[data-variant="16"]) .design-options button{font-size:10px;padding:8px 9px}
body:is([data-variant="11"],[data-variant="17"],[data-variant="15"],[data-variant="16"]) .design-options button span{font-size:9px;padding-right:5px}

/* 11 FEED: full-width recap, then a continuous split reading surface. */
.feed{--rail:0px}
.feed .flow-overview{background:#fafbfe;padding:32px 48px 26px}
.feed>.findings-start{padding-left:48px;padding-right:48px}
.feed .flow-overview .change-list{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 48px}
.feed .flow-finding{padding-bottom:45px}
.feed .flow-finding+.flow-finding{border-top:9px solid #f0f3f8}
.feed .flow-archives{background:#fafbfc}


.flow-code .code-body{overscroll-behavior:contain}

/* 15 GITHUB: repository context, compact boxes, review threads and green actions. */
.github{--blue:#0969da;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;background:#fff;color:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.github p{color:#1f2328;font-size:14px}
.github .gh-overview{padding:0;border-bottom:1px solid #d1d9e0}
.gh-repo-bar{display:flex;align-items:center;gap:12px;background:#f6f8fa;border-bottom:1px solid #d1d9e0;padding:20px 36px;font-size:14px;color:#0969da}
.gh-repo-bar b{font-weight:600;color:#1f2328}
.gh-repo-icon{font-size:24px;line-height:1;color:#59636e}
.gh-private{font-size:11px;border:1px solid #d1d9e0;color:#59636e;border-radius:20px;padding:1px 8px}
.gh-repo-bar .sample{margin-left:auto}
.gh-review-title{padding:28px 40px 25px}
.github .gh-review-title h1{font-size:30px;font-weight:400;letter-spacing:-.5px}
.gh-review-title h1>span{color:#59636e;font-weight:300}
.gh-review-subtitle{display:flex;align-items:center;gap:12px;margin-top:14px;color:#59636e;font-size:12px}
.gh-state{background:#1f883d;color:#fff;font-size:12px;border-radius:20px;padding:5px 12px}
.gh-review-subtitle code{font:11px ui-monospace,monospace;background:#ddf4ff;color:#0969da;border-radius:5px;padding:3px 7px}
.gh-recap-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding:0 40px 30px}
.gh-description{border:1px solid #d1d9e0;border-radius:6px;overflow:hidden}
.gh-box-heading{background:#f6f8fa;border-bottom:1px solid #d1d9e0;display:flex;justify-content:space-between;align-items:center;padding:13px 18px;font-size:12px}
.gh-box-heading>span{font-size:11px;color:#59636e}
.gh-description-body{padding:6px 20px 0}
.github .change-list{gap:10px;margin:17px 0 21px}
.github .change-list li{font-size:14px;line-height:1.6;color:#1f2328;gap:10px}
.github .change-number{width:4px;height:4px;background:#59636e;border-radius:50%;font-size:0;align-self:flex-start;margin-top:9px}
.github .flow-context{margin-bottom:5px;padding:12px 0;border-top:1px solid #d1d9e0;border-bottom:0}
.github .flow-context summary{font-size:12px;color:#59636e}
.gh-review-meta h3{font-size:12px;font-weight:600;margin-bottom:10px}
.github .flow-coverage{background:#fff8c5;border:1px solid #d4a72c66;color:#633c01;border-radius:6px;padding:12px;margin:0 0 22px}
.github .flow-coverage small{color:#7d652d}
.github .flow-counts{gap:15px;color:#59636e;margin-bottom:18px}
.github .flow-counts strong{color:#1f2328}
.github .primary{background:#1f883d;border:1px solid #1f232826;border-radius:6px;box-shadow:0 1px 0 #1f23281a;color:#fff;padding:7px 14px;font-size:12px;font-weight:600}
.github .primary:hover{background:#1a7f37}
.github .secondary{background:#f6f8fa;color:#25292e;border-color:#d1d9e0;box-shadow:0 1px 0 #1f23280a;padding:7px 14px;font-size:12px}
.github>.findings-start{padding:18px 40px;border-bottom:1px solid #d1d9e0;background:#f6f8fa}
.github>.findings-start h2{font-size:15px;font-weight:600}
.github>.findings-start>span{color:#59636e;font-size:11px}
.github .flow-reading{padding:24px 26px 110px 58px}
.github .active-findings{position:relative}
.github .active-findings:before{content:'';position:absolute;left:-24px;top:10px;bottom:0;width:2px;background:#d1d9e0}
.github .flow-finding{padding:0 22px 24px;border:1px solid #d1d9e0;border-radius:6px;background:#fff;margin-bottom:28px}
.github .active-findings>.flow-finding:before{content:'◉';position:absolute;left:-36px;top:11px;border:4px solid #fff;background:#f6f8fa;color:#1f883d;border-radius:50%;width:25px;height:25px;display:grid;place-items:center;font-size:14px;line-height:1}
.gh-thread-meta{display:flex;align-items:center;gap:8px;padding:12px 16px;margin:0 -22px 21px;background:#f6f8fa;border-bottom:1px solid #d1d9e0;border-radius:6px 6px 0 0;font-size:11px;color:#59636e}
.gh-thread-meta>span:first-child{color:#1f883d;font-size:14px}
.gh-thread-meta strong{font-weight:600;color:#1f2328}
.gh-thread-state{margin-left:auto;border:1px solid #d1d9e0;border-radius:20px;font-size:10px;padding:0 7px}
.github .flow-finding.is-current{border-color:#54aeff}
.github .flow-finding.is-current .gh-thread-meta{background:#ddf4ff;border-bottom-color:#b6e3ff}
.github .flow-finding-header:before{display:none}
.github .finding-chapter{display:none}
.github .flow-finding h2{font-size:23px;line-height:1.3;font-weight:600;letter-spacing:-.4px}
.github .tags{margin:14px 0 19px;gap:6px}
.github .badge{border-radius:20px;font-size:10px;padding:2px 8px;border:1px solid #d1d9e0;background:#f6f8fa;color:#59636e}
.github .badge.high{background:#ffebe9;border-color:#ff818266;color:#a40e26}
.github .badge.medium{background:#fff8c5;border-color:#d4a72c66;color:#7d4e00}
.github .badge.supported{background:#dafbe1;border-color:#4ac26b66;color:#116329}
.github .badge.uncertain{background:#fff8c5;border-color:#d4a72c66;color:#7d4e00}
.github .reviewer-attribution{color:#59636e}
.github .finding-consequence{background:transparent;border:0;border-left:3px solid #0969da;border-radius:0;padding:0 0 0 15px;margin:23px 0}
.github .finding-consequence h3{font-size:13px;letter-spacing:0;text-transform:none;color:#0969da;font-weight:600}
.github .finding-consequence p{font-size:15px;line-height:1.7;color:#1f2328}
.github .finding-mechanism h3,.github .repro h3,.github .confidence-limits h3{font-size:14px;font-weight:600}
.github .repro{padding-top:17px}
.github .confidence-limits p{color:#59636e;font-size:12px}
.github .flow-decision{padding-top:17px}
.github textarea{background:#f6f8fa!important;border-color:#d1d9e0;border-radius:6px}
.github .flow-archives{padding:22px 0;border:0}
.github .flow-archive{background:#f6f8fa;border-color:#d1d9e0}
.github .flow-archive .flow-finding{padding:0 22px 24px;border-radius:0;margin:0}
.github .flow-code-heading{background:#f6f8fa;border-color:#d1d9e0}
.github .flow-code-index{background:#ddf4ff;color:#0969da}
.github .flow-code-heading small,.github .follow-indicator{color:#59636e}
.github .editor-toolbar{background:#fff;border-color:#d1d9e0}
.github .editor-panel .file-tabs button{font-size:11px;color:#59636e}
.github .editor-panel .file-tabs button.active{color:#1f2328;border-bottom-color:#fd8c73}
.github .editor-panel .segmented{border:1px solid #d1d9e0;background:#f6f8fa;padding:2px}
.github .editor-panel .segmented button.active{background:#fff;color:#1f2328;box-shadow:0 1px 3px #1f232826}
.github .editor-panel .code-body{background:#fff}
.github .editor-panel .code-line.highlight{background:#ddf4ff;box-shadow:inset 2px 0 #54aeff}
.github .editor-panel .source-status{background:#f6f8fa;border-color:#d1d9e0;color:#59636e}
.github .editor-panel .inline-review-comment{border-color:#d1d9e0;border-radius:6px;padding:0;box-shadow:0 1px 0 #1f23280a;overflow:hidden}
.github .inline-comment-heading{padding:9px 13px;background:#f6f8fa;border-bottom:1px solid #d1d9e0}
.github .editor-panel .inline-review-comment p{margin:0;padding:12px 13px;color:#1f2328}
:is(.github,.feed) .code-body .hljs-keyword{color:#cf222e}
:is(.github,.feed) .code-body .hljs-title{color:#8250df}
:is(.github,.feed) .code-body .hljs-string{color:#0a3069}
:is(.github,.feed) .code-body .hljs-number,:is(.github,.feed) .code-body .hljs-literal{color:#0550ae}

/* 16 AI HERO: bold DM Sans, mono labels, yellow actions and warm spectrum accents. */
.aihero{--blue:#edb52f;--ink:#14161a;--muted:#63676c;--line:#d9dadd;background:#fafafb;color:#14161a;font-family:'Review DM Sans',sans-serif}
.aihero p{font-family:'Review DM Sans',sans-serif;color:#626467}
.aihero .ai-overview{padding:0 48px 30px;position:relative;isolation:isolate;background:#fafafb}
.ai-topbar{display:flex;align-items:center;gap:18px;border-bottom:1px solid #d9dadd;padding:24px 0}
.ai-topbar>strong{font:700 17px ui-monospace,monospace;color:#14161a}
.ai-topbar>strong>span{color:#b1b3b8}
.ai-ref{font-size:12px;color:#7b7d82}
.ai-topbar .sample{margin-left:auto}
.ai-recap-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:70px;padding:55px 0 45px;position:relative}
.ai-hero-copy{position:relative}
.ai-kicker{font:10px/1.7 ui-monospace,monospace;letter-spacing:.11em;color:#73767c}
.aihero .ai-hero-copy h1{font-family:'Review DM Sans',sans-serif;font-size:clamp(58px,5.8vw,90px);font-weight:750;letter-spacing:-.055em;line-height:.97;margin:22px 0 22px;color:#14161a}
.ai-period{color:#e5ac28}
.aihero .ai-hero-copy>p{font-size:19px;line-height:1.5;margin:0 0 25px;color:#686a70}
.ai-stats{display:flex;gap:55px;border-top:1px solid #d9dadd;padding-top:20px;margin-bottom:27px;max-width:440px}
.ai-stats strong{display:block;font:500 29px/1.2 ui-monospace,monospace;color:#14161a}
.ai-stats span{font:9px ui-monospace,monospace;color:#7c7e84;letter-spacing:.07em;display:block;margin-top:7px}
.ai-change-sheet{position:relative;align-self:center;background:#fff;border:1px solid #d6d7db;padding:27px 29px;box-shadow:7px 7px 0 #ececef}
.ai-change-sheet:before{content:'';position:absolute;z-index:-1;inset:-24px -20px 15px -24px;background:linear-gradient(120deg,#f7c64f33,#ff80398c 45%,#fc56a680 75%,#ff4b324d);filter:blur(18px)}
.ai-sheet-heading{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #d9dadd;padding-bottom:19px;font:10px ui-monospace,monospace;letter-spacing:.1em;color:#787a81}
.aihero .change-list{gap:0;margin:0}
.aihero .change-list li{padding:21px 0;border-bottom:1px solid #e2e2e6;font-size:16px;line-height:1.55;color:#303238;gap:18px}
.aihero .change-number{font:11px ui-monospace,monospace;color:#8d8f97}
.aihero .flow-context{border:0;margin:9px 0 0;padding:8px 0}
.aihero .flow-context summary{color:#777a80;font-size:11px}
.aihero .flow-context p{font-size:12px}
.aihero .flow-coverage{margin:4px 0 0;background:#f8f2df;border:1px solid #e6d8aa;border-radius:0;padding:12px 17px}
.aihero .flow-coverage>span{font-size:12px;color:#79612a}
.aihero .flow-coverage small{font-size:10px}
.aihero .primary{background:#f7c64f;color:#17191d;border:1px solid #f0bf4a;border-radius:6px;font-family:'Review DM Sans',sans-serif;font-size:13px;font-weight:750;padding:12px 21px;box-shadow:none}
.aihero .primary:hover{background:#efbb37}

 if(e.kind==='check')return `<details><summary>⌘ Suggested check <span class="muted">not run</span></summary><pre>${esc(e.command)}</pre><p>${esc(e.output)}</p></details>`;
 return '';

function uncertainty(f) { return f.assessment.status!=='needs-verification'?'':`<div class="uncertainty"><strong>Verify before treating this as a regression</strong><p>${esc(f.assessment.assumptions[0])}</p><ul>${f.assessment.verificationSteps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`; }

function viewerState(f) { return viewers[f.id] ||= {view:0, side:f.problematicLocation.kind==='deletion'?'before':'after', range:'all', full:false}; }
const highlightedSourceCache = new Map();
function highlightedLines(content, path) {
 const key=path+'\0'+content;
 if(highlightedSourceCache.has(key)) return highlightedSourceCache.get(key);
 const language=({ts:'typescript',tsx:'typescript',js:'javascript',jsx:'javascript',py:'python',json:'json',css:'css',html:'xml',sh:'bash'})[path.split('.').at(-1)];
 if(!language || !hljs.getLanguage(language)) return content.split('\n').map(esc);
 // Highlight the complete file, then preserve token classes across line breaks.
 const parsed=document.createElement('template');
 parsed.innerHTML=hljs.highlight(content,{language,ignoreIllegals:true}).value;
 const lines=[''];
 function walk(node, classes=[]) {
  if(node.nodeType===Node.TEXT_NODE) {
   node.textContent.split('\n').forEach((piece,i)=>{
    if(i) lines.push('');
    lines[lines.length-1]+=classes.length?`<span class="${esc(classes.join(' '))}">${esc(piece)}</span>`:esc(piece);
   });
  } else {
   const next=node.classList?[...classes,...node.classList]:classes;
   node.childNodes.forEach(child=>walk(child,next));
  }
 }
 walk(parsed.content);
 highlightedSourceCache.set(key,lines);
 return lines;
}
function commentToggle() {
 const label=showComments?'Hide all review comments':'Show all review comments';
 const svg=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5v4a2 2 0 0 1-2 2H9l-5 4v-17a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M8 7h8M8 11h6"/>${showComments?'':'<path d="M2 2l20 20"/>'}</svg>`;
 return b(svg,'comments','comment-icon '+(showComments?'active':''),`data-value="${showComments?'none':'all'}" aria-pressed="${showComments}" aria-label="${label}" title="${label}"`);
}
function source(f) {
 const s=viewerState(f), vi=s.view, v=f.codeViews[vi], side=v[s.side];
 const ranges=side.ranges || [];
 let body='';
 if(side.kind==='absent') body=`<div class="no-code"><strong>${side.reason==='deleted'?'This file was deleted':'This file is new'}</strong><p>Switch to ${side.reason==='deleted'?'Before':'After'} to inspect the source.</p></div>`;
 else {
  const content=R.sourceFiles.find(x=>x.path===side.path&&x.revision===side.revision)?.content || '';
  const syntax=highlightedLines(content,side.path);
  const lines=content.split('\n'); if(lines.at(-1)==='') lines.pop();
  const chosen=ranges;
  const show=lines.map((_,i)=>i);
  let previous=-1;
  body=show.map(i=>{
   const gap=previous>=0&&i>previous+1?'<div class="code-gap">···</div>':'';
   previous=i;
   const line=`<div class="code-line ${chosen.some(r=>i+1>=r.startLine&&i+1<=r.endLine)?'highlight':''}"><span class="line-number">${i+1}</span><code>${syntax[i]}</code></div>`;
   let annotations='';
   if(showComments) {
    if(i+1===ranges[0]?.endLine) annotations+=`<div class="inline-review-comment"><div class="inline-comment-heading"><span class="comment-mark">↳</span><strong>Review note</strong><span>${esc(v.label)}</span></div><p>${esc(v.explanation)}</p></div>`;
   }
   return gap+line+annotations;
  }).join('');
 }
 return `<section class="source-panel editor-panel" data-source="${f.id}">
 <div class="editor-toolbar"><div class="file-tabs">${f.codeViews.map((v,i)=>b(`<span>${i===0?'◎':'↳'}</span> ${esc(v.label)}`,'view',i===vi?'active':'',`data-index="${i}" data-id="${f.id}" title="${esc(v.label)}"`)).join('')}</div>
 <div class="source-controls">${commentToggle()}<div class="segmented">${['before','after'].map(x=>b(x==='before'?'Before':'After','side',s.side===x?'active':'',`data-value="${x}" data-id="${f.id}"`)).join('')}</div></div></div>
 <div class="code-body">${body}</div><div class="source-path source-status"><span>${esc(side.path || v.before.path || v.after.path)}</span><small>${s.side==='after'?'HEAD':'BASE'}</small></div></section>`;
}
function switcher() {

// Brand-inspired treatments preserve Feed's recap-first layout and all interactions.
function githubOverview() {
 return `<header class="flow-overview gh-overview" id="review-overview"><div class="gh-repo-bar"><img class="review-logo" src="${appLogo}" alt="Review"><span>project-refactor <b>/ Code review</b></span><span class="gh-private">Local</span>${sample()}</div><div class="gh-review-title"><h1>What changed <span>#024</span></h1><div class="gh-review-subtitle"><span class="gh-state">◉ Review</span><code>${esc(R.request.scope.baseSha)} → ${esc(R.request.scope.headSha)}</code><span>${R.request.scope.changedPaths.length} changed files</span></div></div><div class="gh-recap-grid"><section class="gh-description"><div class="gh-box-heading"><strong>Change summary</strong><span>Behavior before → after</span></div><div class="gh-description-body">${changeList()}${flowContext()}</div></section><aside class="gh-review-meta"><h3>Review coverage</h3>${flowCoverage()}<h3>Findings</h3>${flowCounts()}${b('Start review ↓','flow-start','primary')}</aside></div></header>`;
}
function githubFinding(f) {
 const meta=`<div class="gh-thread-meta"><span>◉</span><strong>Finding ${flowNumber(f)}</strong><span>· ${f.codeViews.length} files</span><span class="gh-thread-state">${state(f)==='rejected'?'Discarded':state(f)==='done'?'Done':'Open'}</span></div>`;
 return feedFinding(f).replace(flowFindingHeader(f),meta+flowFindingHeader(f));
}
function aiheroOverview() {
 return `<header class="flow-overview ai-overview" id="review-overview"><div class="ai-topbar">${appIdentity()}<span class="ai-ref">project-refactor</span>${sample()}</div><div class="ai-recap-grid"><div class="ai-hero-copy"><span class="ai-kicker">CODE REVIEW · ${esc(R.request.scope.baseSha)} → ${esc(R.request.scope.headSha)}</span><h1>What<br>changed<span class="ai-period">.</span></h1><p>Understand the change.<br>Inspect the consequences.</p><div class="ai-stats"><div><strong>${openFindings().length}</strong><span>OPEN FINDINGS</span></div><div><strong>2 / 3</strong><span>REVIEWERS COMPLETED</span></div></div>${b('Explore the findings →','flow-start','primary')}</div><div class="ai-change-sheet"><div class="ai-sheet-heading"><span>THE CHANGESET</span><span>01—04</span></div>${changeList()}${flowContext()}</div></div>${flowCoverage()}</header>`;
}
function aiheroFinding(f) {
 const header=`<header class="flow-finding-header ai-finding-header"><div class="ai-finding-kicker"><span class="ai-finding-number">${flowNumber(f)}</span><span>THE FINDING / ${f.codeViews.length} SOURCE FILES</span></div><h2 data-track-title="${f.id}">${esc(f.title)}</h2>${tags(f)}</header>`;
 return feedFinding(f).replace(flowFindingHeader(f),header);
}
function renderGitHub(){return `<div class="flow github">${githubOverview()}${flowFindingsHeading()}<div class="flow-layout"><main class="flow-reading">${flowFindings(false)}</main><aside class="flow-code" aria-label="Source code follows the current finding">${flowCode()}</aside></div>${flowToast()}</div>`;}
function renderAIHero(){return `<div class="flow aihero">${aiheroOverview()}${flowFindingsHeading()}<div class="flow-layout"><main class="flow-reading">${flowFindings(false)}</main><aside class="flow-code" aria-label="Source code follows the current finding">${flowCode()}</aside></div>${flowToast()}</div>`;}

render();</script></body></html>
