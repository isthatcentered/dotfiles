set -g default-terminal "tmux-256color"
set -ga terminal-overrides " ,*:RGB"
set -g mouse on 
set -g focus-events on
set -g mode-keys vi

# Copy mouse selections without leaving the current scroll position.
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

set -g extended-keys on
set -g extended-keys-format csi-u

# Keep accepting repeatable prefix bindings for one second.
set -g repeat-time 1000

# Open new panes and windows in the active pane's current directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Prefix + o/hjkl pane navigation.
unbind Left
unbind Right
unbind Up
unbind Down
bind -r o select-pane -t :.+
bind -r h if -F '#{@pane-is-vim}' 'send-keys C-b h' 'select-pane -L'
bind -r j if -F '#{@pane-is-vim}' 'send-keys C-b j' 'select-pane -D'
bind -r k if -F '#{@pane-is-vim}' 'send-keys C-b k' 'select-pane -U'
bind -r l if -F '#{@pane-is-vim}' 'send-keys C-b l' 'select-pane -R'

# Prefix + Alt-hjkl pane resizing.
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# Prefix + n/p window navigation.
bind -r n next-window
bind -r p previous-window

# Prefix + parentheses session navigation.
bind -r '(' switch-client -p
bind -r ')' switch-client -n

# Kill the active pane without prompting for confirmation.
bind x kill-pane

# Match Ghostty's unfocused split overlay (#f0f3f4 at 50% opacity)
# against its white background. Keep the focused pane at terminal defaults.
set -g window-style 'fg=#7f8285,bg=#f8f9fa'
set -g window-active-style 'fg=terminal,bg=terminal'

# Light gray status bar with black text.
set -g status-style bg=colour255,fg=black
set -g window-status-style bg=colour255,fg=black
set -g window-status-current-style bg=colour255,fg=black,bold
set -g message-style bg=colour255,fg=black
set -g message-command-style bg=colour255,fg=black
set -g status-left '[#{session_name}] [#{window_index}:#{window_name}] [#{?pane_title,#{pane_title},#{pane_id}}] '
set -g status-left-length 100
set -g window-status-format ''
set -g window-status-current-format ''
set -g window-status-separator ''
set -g status-right '%H:%M %d-%b-%y'

# Persist sessions, windows, panes, and layouts across restarts.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TPM (keep this at the bottom of the file).
run '~/.tmux/plugins/tpm/tpm'
